name: Refresh ETF data

on:
  workflow_dispatch:
  schedule:
    - cron: "37 10,12 * * 1-5"

permissions:
  contents: write

concurrency:
  group: refresh-etf-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install data dependencies
        run: python -m pip install -r scripts/requirements-data.txt

      - name: Test refresh safeguards
        run: python -m unittest discover -s tests -p "test_refresh_data.py"

      - name: Fetch ETF bars
        run: python scripts/fetch-akshare-etf.py --discover --discover-limit 60 --full-refresh --report refresh-report.json

      - name: Summarize generated data
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path("public/data/a-share-etf-bars.generated.json").read_text(encoding="utf-8"))
          report_path = Path("refresh-report.json")
          report = json.loads(report_path.read_text(encoding="utf-8")) if report_path.exists() else {}
          summary = (
              f"status={report.get('status', 'not completed')} "
              f"latestDate={payload.get('latestDate')} "
              f"expectedDate={report.get('expectedLatestDate')} "
              f"fresh={len(report.get('freshSymbols', []))}/{len(report.get('requestedSymbols', []))} "
              f"discovery={report.get('discoveryMode', 'unknown')} "
              f"motherPool={len(payload.get('requestedSymbols', []))} "
              f"available={len(payload.get('succeededSymbols', []))} "
              f"bars={len(payload.get('bars', []))} "
              f"membershipSnapshots={len(payload.get('universeSnapshots', []))}"
          )
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write("## ETF data refresh\n\n")
              output.write(f"- {summary}\n")
              if report.get("error"):
                  output.write(f"- Error: {report['error']}\n")
              failed = report.get("failedSymbols") or {}
              if failed:
                  output.write(f"- failedSymbols: `{failed}`\n")
          PY

      - name: Preserve refresh diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etf-refresh-diagnostics
          path: refresh-report.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit generated data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "data: refresh a-share etf bars"
          file_pattern: public/data/a-share-etf-bars.generated.json
